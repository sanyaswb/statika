<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор DHCP Lease</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }
    .container {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 100%;
      max-width: 500px;
      box-sizing: border-box;
      margin: auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      position: relative;
      z-index: 1;
    }
    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 5px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .comment-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 10px;
    }
    .comment-row > label {
      margin-top: 0;
    }
    .original-comment-option {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin: 0;
      font-size: 13px;
      font-weight: normal;
      white-space: nowrap;
      cursor: pointer;
    }
    .original-comment-option input {
      width: auto;
      margin: 0;
      padding: 0;
      cursor: inherit;
    }
    .original-comment-option:has(input:disabled) {
      color: #777;
      cursor: help;
    }
    #comment:disabled {
      background: #eee;
    }
    .missing-comment-dialog {
      width: min(400px, calc(100% - 40px));
      box-sizing: border-box;
      padding: 20px;
      border: 0;
      border-radius: 10px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.25);
    }
    .missing-comment-dialog::backdrop {
      background: rgba(0,0,0,0.35);
    }
    .missing-comment-dialog h3 {
      margin: 0;
    }
    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .dialog-actions button {
      margin-top: 15px;
    }
    .dialog-confirm {
      background: #4CAF50;
      color: white;
    }
    button {
      margin-top: 15px;
      padding: 7px 12px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }
    .add-btn {
      background: #4CAF50;
      color: white;
    }
    .save-btn {
      background: #2196F3;
      color: white;
      margin-left: 10px;
    }
    .reset-btn {
      background: #777;
      color: white;
      margin-left: 10px;
    }
    .mac-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }
    .mac-row input[type="text"] {
      flex: 1;
      min-width: 0;
    }
    .upload-btn {
      margin-top: 5px;
      padding: 5px 10px;
      background: #eee;
      border: 1px solid #ccc;
    }
    .status {
      margin-top: 10px;
      font-size: 14px;
    }
    .status.error {
      color: #b00020;
    }
    .ip-preview {
      margin-top: 5px;
      font-size: 14px;
    }
    .ip-preview.error {
      color: #b00020;
    }
    #mac-list {
      margin-top: 10px;
      max-height: 180px;
      overflow-y: auto;
    }
    .remove-btn {
      background: #f44336;
      color: white;
      margin-left: 10px;
      font-size: 12px;
      padding: 3px 7px;
    }
    .output {
      background: #eee;
      padding: 10px;
      margin-top: 20px;
      border-radius: 5px;
      max-height: 250px;
      overflow-y: auto;
      font-family: monospace;
    }
    .line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 3px 0;
    }
    .line span {
      flex: 1;
      word-break: break-all;
    }
    .feedback-card {
      margin-top: 20px;
    }
    .feedback-card h3 {
      margin-top: 0;
    }
    .rating-field {
      border: 0;
      padding: 0;
      margin: 0;
    }
    .rating-field legend {
      font-weight: bold;
    }
    .stars {
      display: flex;
      gap: 4px;
      margin-top: 6px;
    }
    .star-choice {
      display: inline-flex;
      position: relative;
      margin: 0;
      cursor: pointer;
    }
    .star-choice input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      opacity: 0;
      cursor: pointer;
    }
    .star-icon {
      color: #aaa;
      font-size: 34px;
      line-height: 1;
      transition: color 150ms ease, transform 150ms ease;
    }
    .star-choice.active .star-icon {
      color: #f6b900;
      transform: scale(1.08);
    }
    .star-choice input:focus-visible + .star-icon {
      outline: 2px solid #2196F3;
      outline-offset: 3px;
      border-radius: 3px;
    }
    .feedback-card textarea {
      display: block;
      width: 100%;
      box-sizing: border-box;
      min-height: 80px;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
      resize: vertical;
      font: inherit;
    }
    .feedback-submit {
      background: #673ab7;
      color: white;
    }
    .feedback-message {
      min-height: 20px;
      margin: 10px 0 0;
    }
    .comments-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    .comments-layer.mobile {
      position: relative;
      inset: auto;
      width: 100%;
      max-width: 500px;
      margin: 12px auto 0;
    }
    .floating-comment {
      position: absolute;
      box-sizing: border-box;
      padding: 12px 14px;
      border-radius: 12px;
      box-shadow: 0 5px 16px rgba(0,0,0,0.16);
      overflow-wrap: anywhere;
      transform: rotate(var(--tilt));
    }
    .floating-comment .note-stars {
      color: #805600;
      letter-spacing: 2px;
    }
    .floating-comment p {
      margin: 6px 0 0;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <h3>DHCP Lease Generator</h3>

    <label for="ip">Введіть IP:</label>
    <input type="text" id="ip" placeholder="192.168.10.22" oninput="updateIpPreview()">
    <div id="ip-preview" class="ip-preview" aria-live="polite"></div>

    <div class="comment-row">
      <label for="comment">Введіть коментар:</label>
      <label class="original-comment-option" id="original-comment-option" title="коментарів не знайдено">
        <input type="checkbox" id="preserve-comments" title="коментарів не знайдено" disabled onchange="toggleOriginalComments()">
        <span>Оригінальні з файлу</span>
      </label>
    </div>
    <input type="text" id="comment" placeholder="коментар">

    <label for="mac">Введіть MAC:</label>
    <div class="mac-row">
      <input type="text" id="mac" placeholder="B4:19:74:DC:EA:1F">
      <button class="upload-btn" type="button" title="Імпортувати MAC-адреси з .rsc або .txt" aria-label="Імпортувати MAC-адреси з файлу" onclick="document.getElementById('mac-file').click()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V3m0 0L7 8m5-5 5 5M4 16v4h16v-4"/></svg>
      </button>
      <input type="file" id="mac-file" accept=".rsc,.txt" hidden onchange="loadMacFile(event)">
    </div>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <details id="mac-list" hidden>
      <summary id="mac-list-title"></summary>
      <ol id="mac-list-items"></ol>
    </details>

    <label for="server">Введіть сервер:</label>
    <input type="text" id="server" placeholder="server10">

    <div>
      <button class="add-btn" onclick="addLine()">+ Додати</button>
      <button class="reset-btn" onclick="resetFields()">Reset</button>
      <button class="save-btn" onclick="saveFile('txt')">Завантажити .txt</button>
      <button class="save-btn" onclick="saveFile('rsc')">Завантажити .rsc</button>
    </div>

    <div class="output" id="output">
      <div class="line"><span>/ip dhcp-server lease</span></div>
    </div>
  </div>

  <dialog id="missing-comment-dialog" class="missing-comment-dialog" aria-labelledby="missing-comment-title" aria-describedby="missing-comment-count">
    <form id="missing-comment-form">
      <h3 id="missing-comment-title">Назва для записів без коментаря</h3>
      <p id="missing-comment-count"></p>
      <label for="default-comment-name">Введіть назву:</label>
      <input id="default-comment-name" type="text" maxlength="80" required>
      <div class="dialog-actions">
        <button type="button" id="cancel-default-comment">Скасувати</button>
        <button type="submit" class="dialog-confirm">Зберегти назву</button>
      </div>
    </form>
  </dialog>

  <section class="container feedback-card" id="feedback" aria-labelledby="feedback-title">
    <h3 id="feedback-title">Оцініть програму</h3>
    <form id="feedback-form">
      <fieldset class="rating-field">
        <legend>Оцінка від 1 до 5 зірок</legend>
        <div class="stars">
          <label class="star-choice"><input type="radio" name="rating" value="1" aria-label="1 зірка" required><span class="star-icon" aria-hidden="true">★</span></label>
          <label class="star-choice"><input type="radio" name="rating" value="2" aria-label="2 зірки"><span class="star-icon" aria-hidden="true">★</span></label>
          <label class="star-choice"><input type="radio" name="rating" value="3" aria-label="3 зірки"><span class="star-icon" aria-hidden="true">★</span></label>
          <label class="star-choice"><input type="radio" name="rating" value="4" aria-label="4 зірки"><span class="star-icon" aria-hidden="true">★</span></label>
          <label class="star-choice"><input type="radio" name="rating" value="5" aria-label="5 зірок"><span class="star-icon" aria-hidden="true">★</span></label>
        </div>
      </fieldset>
      <label for="feedback-comment">Коментар</label>
      <textarea id="feedback-comment" maxlength="160" placeholder="Напишіть ваш відгук" required></textarea>
      <button class="feedback-submit" type="submit">Залишити відгук</button>
      <p id="feedback-message" class="feedback-message" role="status" aria-live="polite"></p>
    </form>
  </section>
  <div id="comments-layer" class="comments-layer" aria-live="polite"></div>

  <script>
    const header = "/ip dhcp-server lease";
    let lines = [header];
    let importedEntries = [];
    let importToken = 0;
    let defaultComment = null;

    function setStatus(message, isError = false) {
      const status = document.getElementById("status");
      status.textContent = message;
      status.classList.toggle("error", isError);
    }

    function missingCommentCount() {
      return importedEntries.filter(entry => !entry.originalComment || !entry.originalComment.trim()).length;
    }

    function formattedDefaultComment() {
      const name = defaultComment.trim();
      return name.startsWith("==") && name.endsWith("==") ? name : `==${name}==`;
    }

    function parseImportedEntries(content) {
      const entries = [];
      const byMac = new Map();
      const pattern = /\bmac-address\s*=\s*["']?([0-9a-f]{2}(?::[0-9a-f]{2}){5})(?=$|[\s;"'\\])/gi;
      const logicalLines = [];
      let pending = "";
      for (const line of content.split(/\r?\n/)) {
        if (line.trimStart().startsWith("#")) continue;
        const continued = /\\\s*$/.test(line);
        pending += (pending ? " " : "") + line.replace(/\\\s*$/, "");
        if (!continued) {
          logicalLines.push(pending);
          pending = "";
        }
      }
      if (pending) logicalLines.push(pending);

      function originalComment(line) {
        const match = line.match(/\bcomment\s*=\s*(?:"((?:\\.|[^"\\])*)"|([^\s;\\]+))/i);
        return match ? (match[1] ?? match[2]) : null;
      }

      function addEntry(mac, comment) {
        const existing = byMac.get(mac);
        if (existing) {
          if (!existing.originalComment && comment) existing.originalComment = comment;
          return;
        }
        const entry = { mac, originalComment: comment };
        byMac.set(mac, entry);
        entries.push(entry);
      }

      for (const line of logicalLines) {
        const comment = originalComment(line);
        for (const match of line.matchAll(pattern)) addEntry(match[1].toUpperCase(), comment);
      }
      if (entries.length === 0) {
        const fallback = /(?:^|[^0-9a-f:.-])((?:[0-9a-f]{2}:){5}[0-9a-f]{2}|(?:[0-9a-f]{2}-){5}[0-9a-f]{2}|(?:[0-9a-f]{4}\.){2}[0-9a-f]{4})(?![0-9a-f:.-])/gi;
        for (const line of logicalLines) {
          const comment = originalComment(line);
          for (const match of line.matchAll(fallback)) {
            const hex = match[1].replace(/[:.-]/g, "").toUpperCase();
            addEntry(hex.match(/.{2}/g).join(":"), comment);
          }
        }
      }
      return entries;
    }

    function parseIpv4(value) {
      const parts = value.split(".");
      if (parts.length !== 4 || parts.some(part => !/^\d{1,3}$/.test(part) || Number(part) > 255)) {
        return null;
      }
      return parts.reduce((number, part) => number * 256 + Number(part), 0);
    }

    function formatIpv4(number) {
      return [
        Math.floor(number / 16777216),
        Math.floor(number / 65536) % 256,
        Math.floor(number / 256) % 256,
        number % 256
      ].join(".");
    }

    function updateIpPreview() {
      const preview = document.getElementById("ip-preview");
      preview.textContent = "";
      preview.classList.remove("error");
      if (!importedEntries.length) return;
      const ip = document.getElementById("ip").value.trim();
      if (!ip) {
        preview.textContent = `Введіть першу IP-адресу для ${importedEntries.length} MAC-адрес.`;
        return;
      }
      const start = parseIpv4(ip);
      if (start === null || start + importedEntries.length - 1 > 0xFFFFFFFF) {
        preview.textContent = "Введіть коректну початкову IP-адресу.";
        preview.classList.add("error");
        return;
      }
      preview.textContent = `Діапазон для ${importedEntries.length} MAC-адрес: ${formatIpv4(start)}–${formatIpv4(start + importedEntries.length - 1)}.`;
    }

    function leaseLine(ip, formattedComment, mac, server) {
      return `add address=${ip} comment="${formattedComment}" mac-address=${mac} server=${server}`;
    }

    function renderMacList() {
      const list = document.getElementById("mac-list");
      const items = document.getElementById("mac-list-items");
      items.replaceChildren();
      list.hidden = importedEntries.length === 0;
      if (!importedEntries.length) return;
      document.getElementById("mac-list-title").textContent = `Список MAC-адрес (${importedEntries.length})`;
      const fragment = document.createDocumentFragment();
      for (const entry of importedEntries) {
        const item = document.createElement("li");
        item.textContent = entry.originalComment
          ? `${entry.mac} — ${entry.originalComment}` : `${entry.mac} — без коментаря`;
        fragment.appendChild(item);
      }
      items.appendChild(fragment);
    }

    async function loadMacFile(event) {
      const input = event.target;
      const file = input.files[0];
      if (!file) return;
      input.value = "";
      const token = ++importToken;
      if (!/\.(rsc|txt)$/i.test(file.name)) {
        setStatus("Оберіть файл .rsc або .txt.", true);
        return;
      }
      let content;
      try {
        content = await file.text();
      } catch (error) {
        if (token === importToken) setStatus("Не вдалося прочитати файл.", true);
        return;
      }
      if (token !== importToken) return;
      const entries = parseImportedEntries(content);
      if (!entries.length) {
        setStatus("У файлі не знайдено MAC-адрес.", true);
        return;
      }
      importedEntries = entries;
      defaultComment = null;
      lines = [header];
      renderOutput();
      renderMacList();
      const macInput = document.getElementById("mac");
      macInput.value = `Знайдено ${entries.length} MAC-адрес`;
      macInput.readOnly = true;
      const commentCount = entries.filter(entry => entry.originalComment && entry.originalComment.trim()).length;
      const preserve = document.getElementById("preserve-comments");
      preserve.checked = false;
      preserve.disabled = commentCount === 0;
      const tooltip = commentCount ? "зберегти оригінальні коментарі з файлу" : "коментарів не знайдено";
      preserve.title = tooltip;
      document.getElementById("original-comment-option").title = tooltip;
      document.getElementById("comment").disabled = false;
      document.getElementById("ip").placeholder = "192.168.10.2";
      document.querySelector(".add-btn").textContent = "Згенерувати";
      setStatus(`Імпортовано ${entries.length} MAC-адрес і ${commentCount} коментарів. Введіть тільки першу IP-адресу.`);
      updateIpPreview();
    }

    function toggleOriginalComments() {
      const preserve = document.getElementById("preserve-comments");
      document.getElementById("comment").disabled = preserve.checked;
      if (preserve.checked) {
        const missing = missingCommentCount();
        if (missing) {
          const dialog = document.getElementById("missing-comment-dialog");
          const input = document.getElementById("default-comment-name");
          document.getElementById("missing-comment-count").textContent =
            `У файлі ${missing} MAC-адрес без коментаря. Ця назва буде використана для них.`;
          input.value = defaultComment ?? "Без назви";
          input.setCustomValidity("");
          setStatus("Введіть назву для MAC-адрес без коментаря.");
          dialog.showModal();
          input.select();
        } else {
          setStatus("Оригінальні коментарі збережуться для всіх MAC-адрес.");
        }
      } else {
        setStatus("Введіть спільний коментар для всіх MAC-адрес.");
      }
    }

    const missingCommentDialog = document.getElementById("missing-comment-dialog");
    const defaultCommentInput = document.getElementById("default-comment-name");
    document.getElementById("missing-comment-form").addEventListener("submit", event => {
      event.preventDefault();
      const name = defaultCommentInput.value.trim();
      if (!name || /["\\]/.test(name)) {
        defaultCommentInput.setCustomValidity("Введіть назву без лапок і зворотної косої риски.");
        defaultCommentInput.reportValidity();
        return;
      }
      defaultComment = name;
      missingCommentDialog.close();
      setStatus(`Оригінальні коментарі збережуться; для ${missingCommentCount()} MAC-адрес без коментаря буде «${defaultComment}».`);
    });
    defaultCommentInput.addEventListener("input", () => defaultCommentInput.setCustomValidity(""));
    function cancelDefaultComment() {
      missingCommentDialog.close();
      document.getElementById("preserve-comments").checked = false;
      document.getElementById("comment").disabled = false;
      setStatus("Збереження оригінальних коментарів скасовано. Введіть спільний коментар.");
    }
    document.getElementById("cancel-default-comment").addEventListener("click", cancelDefaultComment);
    missingCommentDialog.addEventListener("cancel", event => {
      event.preventDefault();
      cancelDefaultComment();
    });

    function renderOutput() {
      const output = document.getElementById("output");
      output.innerHTML = "";
      lines.forEach((line, index) => {
        const div = document.createElement("div");
        div.className = "line";

        const span = document.createElement("span");
        span.textContent = line;

        div.appendChild(span);

        // перший рядок (/ip dhcp...) не можна видалити
        if (index !== 0) {
          const btn = document.createElement("button");
          btn.className = "remove-btn";
          btn.textContent = "[-]";
          btn.onclick = () => removeLine(index);
          div.appendChild(btn);
        }

        output.appendChild(div);
      });
    }

    function addLine() {
      const ip = document.getElementById("ip").value.trim();
      const comment = document.getElementById("comment").value.trim();
      const mac = document.getElementById("mac").value.trim();
      const server = document.getElementById("server").value.trim();
      const preserveComments = document.getElementById("preserve-comments").checked;

      if (!ip || (!preserveComments && !comment) || !server || (!importedEntries.length && !mac)) {
        setStatus("Будь ласка, заповніть всі поля!", true);
        return;
      }

      if (importedEntries.length) {
        if (preserveComments && missingCommentCount() && !defaultComment) {
          toggleOriginalComments();
          return;
        }
        const start = parseIpv4(ip);
        if (start === null) {
          setStatus("Введіть коректну початкову IP-адресу, наприклад 192.168.10.2.", true);
          return;
        }
        const last = start + importedEntries.length - 1;
        if (last > 0xFFFFFFFF) {
          setStatus("Для всіх MAC-адрес не вистачає адрес IPv4 після вказаного IP.", true);
          return;
        }
        lines = [header];
        importedEntries.forEach((entry, index) => {
          const formattedComment = preserveComments
            ? (entry.originalComment && entry.originalComment.trim() ? entry.originalComment : formattedDefaultComment())
            : `==${comment}==`;
          lines.push(leaseLine(formatIpv4(start + index), formattedComment, entry.mac, server));
        });
        setStatus(`Згенеровано ${importedEntries.length} записів: ${formatIpv4(start)}-${formatIpv4(last)}.`);
      } else {
        if (parseIpv4(ip) === null || !/^[0-9a-f]{2}(?::[0-9a-f]{2}){5}$/i.test(mac)) {
          setStatus("Введіть коректні IP та MAC-адресу.", true);
          return;
        }
        lines.push(leaseLine(ip, `==${comment}==`, mac, server));
        setStatus("Запис додано.");
      }

      renderOutput();
    }

    function resetFields() {
      importToken++;
      importedEntries = [];
      defaultComment = null;
      for (const id of ["ip", "comment", "mac", "server"]) {
        document.getElementById(id).value = "";
      }
      const preserve = document.getElementById("preserve-comments");
      preserve.checked = false;
      preserve.disabled = true;
      preserve.title = "коментарів не знайдено";
      document.getElementById("original-comment-option").title = "коментарів не знайдено";
      document.getElementById("comment").disabled = false;
      document.getElementById("mac").readOnly = false;
      document.getElementById("mac-file").value = "";
      document.getElementById("ip").placeholder = "192.168.10.22";
      document.querySelector(".add-btn").textContent = "+ Додати";
      renderMacList();
      updateIpPreview();
      setStatus("");
    }

    function removeLine(index) {
      lines.splice(index, 1);
      renderOutput();
    }

    function saveFile(extension) {
      const blob = new Blob([lines.join("\n")], { type: "text/plain" });
      const a = document.createElement("a");
      const url = URL.createObjectURL(blob);
      a.href = url;
      a.download = `dhcp_leases.${extension}`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // показати стартовий рядок
    renderOutput();
  </script>
  <script src="./feedback.js" defer></script>
</body>
</html>
