<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор DHCP Lease</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }
    .container {
      background: white;
      padding: 20px;
      border-radius: 10px;
      width: 100%;
      max-width: 500px;
      box-sizing: border-box;
      margin: auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 5px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      margin-top: 15px;
      padding: 7px 12px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }
    .add-btn {
      background: #4CAF50;
      color: white;
    }
    .save-btn {
      background: #2196F3;
      color: white;
      margin-left: 10px;
    }
    .reset-btn {
      background: #777;
      color: white;
      margin-left: 10px;
    }
    .mac-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }
    .mac-row input[type="text"] {
      flex: 1;
      min-width: 0;
    }
    .upload-btn {
      margin-top: 5px;
      padding: 5px 10px;
      background: #eee;
      border: 1px solid #ccc;
    }
    .status {
      margin-top: 10px;
      font-size: 14px;
    }
    .status.error {
      color: #b00020;
    }
    .ip-preview {
      margin-top: 5px;
      font-size: 14px;
    }
    .ip-preview.error {
      color: #b00020;
    }
    #mac-list {
      margin-top: 10px;
      max-height: 180px;
      overflow-y: auto;
    }
    .remove-btn {
      background: #f44336;
      color: white;
      margin-left: 10px;
      font-size: 12px;
      padding: 3px 7px;
    }
    .output {
      background: #eee;
      padding: 10px;
      margin-top: 20px;
      border-radius: 5px;
      max-height: 250px;
      overflow-y: auto;
      font-family: monospace;
    }
    .line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 3px 0;
    }
    .line span {
      flex: 1;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="container">
    <h3>DHCP Lease Generator</h3>

    <label for="ip">Введіть IP:</label>
    <input type="text" id="ip" placeholder="192.168.10.22" oninput="updateIpPreview()">
    <div id="ip-preview" class="ip-preview" aria-live="polite"></div>

    <label for="comment">Введіть коментар:</label>
    <input type="text" id="comment" placeholder="коментар">

    <label for="mac">Введіть MAC:</label>
    <div class="mac-row">
      <input type="text" id="mac" placeholder="B4:19:74:DC:EA:1F">
      <button class="upload-btn" type="button" title="Імпортувати MAC-адреси з .rsc або .txt" aria-label="Імпортувати MAC-адреси з файлу" onclick="document.getElementById('mac-file').click()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V3m0 0L7 8m5-5 5 5M4 16v4h16v-4"/></svg>
      </button>
      <input type="file" id="mac-file" accept=".rsc,.txt" hidden onchange="loadMacFile(event)">
    </div>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <details id="mac-list" hidden>
      <summary id="mac-list-title"></summary>
      <ol id="mac-list-items"></ol>
    </details>

    <label for="server">Введіть сервер:</label>
    <input type="text" id="server" placeholder="server10">

    <div>
      <button class="add-btn" onclick="addLine()">+ Додати</button>
      <button class="reset-btn" onclick="resetFields()">Reset</button>
      <button class="save-btn" onclick="saveFile('txt')">Завантажити .txt</button>
      <button class="save-btn" onclick="saveFile('rsc')">Завантажити .rsc</button>
    </div>

    <div class="output" id="output">
      <div class="line"><span>/ip dhcp-server lease</span></div>
    </div>
  </div>

  <script>
    const header = "/ip dhcp-server lease";
    let lines = [header];
    let importedMacs = [];
    let importToken = 0;

    function setStatus(message, isError = false) {
      const status = document.getElementById("status");
      status.textContent = message;
      status.classList.toggle("error", isError);
    }

    function parseMacAddresses(content) {
      const unique = new Set();
      const pattern = /\bmac-address\s*=\s*["']?([0-9a-f]{2}(?::[0-9a-f]{2}){5})(?=$|[\s;"'\\])/gi;
      const activeLines = content.split(/\r?\n/).filter(line => !line.trimStart().startsWith("#"));
      for (const line of activeLines) {
        for (const match of line.matchAll(pattern)) unique.add(match[1].toUpperCase());
      }
      if (unique.size === 0) {
        const fallback = /(?:^|[^0-9a-f:.-])((?:[0-9a-f]{2}:){5}[0-9a-f]{2}|(?:[0-9a-f]{2}-){5}[0-9a-f]{2}|(?:[0-9a-f]{4}\.){2}[0-9a-f]{4})(?![0-9a-f:.-])/gi;
        for (const line of activeLines) {
          for (const match of line.matchAll(fallback)) {
            const hex = match[1].replace(/[:.-]/g, "").toUpperCase();
            unique.add(hex.match(/.{2}/g).join(":"));
          }
        }
      }
      return [...unique];
    }

    function parseIpv4(value) {
      const parts = value.split(".");
      if (parts.length !== 4 || parts.some(part => !/^\d{1,3}$/.test(part) || Number(part) > 255)) {
        return null;
      }
      return parts.reduce((number, part) => number * 256 + Number(part), 0);
    }

    function formatIpv4(number) {
      return [
        Math.floor(number / 16777216),
        Math.floor(number / 65536) % 256,
        Math.floor(number / 256) % 256,
        number % 256
      ].join(".");
    }

    function updateIpPreview() {
      const preview = document.getElementById("ip-preview");
      preview.textContent = "";
      preview.classList.remove("error");
      if (!importedMacs.length) return;
      const ip = document.getElementById("ip").value.trim();
      if (!ip) {
        preview.textContent = `Введіть першу IP-адресу для ${importedMacs.length} MAC-адрес.`;
        return;
      }
      const start = parseIpv4(ip);
      if (start === null || start + importedMacs.length - 1 > 0xFFFFFFFF) {
        preview.textContent = "Введіть коректну початкову IP-адресу.";
        preview.classList.add("error");
        return;
      }
      preview.textContent = `Діапазон для ${importedMacs.length} MAC-адрес: ${formatIpv4(start)}–${formatIpv4(start + importedMacs.length - 1)}.`;
    }

    function leaseLine(ip, comment, mac, server) {
      return `add address=${ip} comment="==${comment}==" mac-address=${mac} server=${server}`;
    }

    function renderMacList() {
      const list = document.getElementById("mac-list");
      const items = document.getElementById("mac-list-items");
      items.replaceChildren();
      list.hidden = importedMacs.length === 0;
      if (!importedMacs.length) return;
      document.getElementById("mac-list-title").textContent = `Список MAC-адрес (${importedMacs.length})`;
      const fragment = document.createDocumentFragment();
      for (const mac of importedMacs) {
        const item = document.createElement("li");
        item.textContent = mac;
        fragment.appendChild(item);
      }
      items.appendChild(fragment);
    }

    async function loadMacFile(event) {
      const input = event.target;
      const file = input.files[0];
      if (!file) return;
      input.value = "";
      const token = ++importToken;
      if (!/\.(rsc|txt)$/i.test(file.name)) {
        setStatus("Оберіть файл .rsc або .txt.", true);
        return;
      }
      let content;
      try {
        content = await file.text();
      } catch (error) {
        if (token === importToken) setStatus("Не вдалося прочитати файл.", true);
        return;
      }
      if (token !== importToken) return;
      const macs = parseMacAddresses(content);
      if (!macs.length) {
        setStatus("У файлі не знайдено MAC-адрес.", true);
        return;
      }
      importedMacs = macs;
      lines = [header];
      renderOutput();
      renderMacList();
      const macInput = document.getElementById("mac");
      macInput.value = `Знайдено ${macs.length} MAC-адрес`;
      macInput.readOnly = true;
      document.getElementById("ip").placeholder = "192.168.10.2";
      document.querySelector(".add-btn").textContent = "Згенерувати";
      setStatus(`Імпортовано ${macs.length} MAC-адрес. Введіть тільки першу IP-адресу.`);
      updateIpPreview();
    }

    function renderOutput() {
      const output = document.getElementById("output");
      output.innerHTML = "";
      lines.forEach((line, index) => {
        const div = document.createElement("div");
        div.className = "line";

        const span = document.createElement("span");
        span.textContent = line;

        div.appendChild(span);

        // перший рядок (/ip dhcp...) не можна видалити
        if (index !== 0) {
          const btn = document.createElement("button");
          btn.className = "remove-btn";
          btn.textContent = "[-]";
          btn.onclick = () => removeLine(index);
          div.appendChild(btn);
        }

        output.appendChild(div);
      });
    }

    function addLine() {
      const ip = document.getElementById("ip").value.trim();
      const comment = document.getElementById("comment").value.trim();
      const mac = document.getElementById("mac").value.trim();
      const server = document.getElementById("server").value.trim();

      if (!ip || !comment || !server || (!importedMacs.length && !mac)) {
        setStatus("Будь ласка, заповніть всі поля!", true);
        return;
      }

      if (importedMacs.length) {
        const start = parseIpv4(ip);
        if (start === null) {
          setStatus("Введіть коректну початкову IP-адресу, наприклад 192.168.10.2.", true);
          return;
        }
        const last = start + importedMacs.length - 1;
        if (last > 0xFFFFFFFF) {
          setStatus("Для всіх MAC-адрес не вистачає адрес IPv4 після вказаного IP.", true);
          return;
        }
        lines = [header];
        importedMacs.forEach((address, index) => {
          lines.push(leaseLine(formatIpv4(start + index), comment, address, server));
        });
        setStatus(`Згенеровано ${importedMacs.length} записів: ${formatIpv4(start)}-${formatIpv4(last)}.`);
      } else {
        if (parseIpv4(ip) === null || !/^[0-9a-f]{2}(?::[0-9a-f]{2}){5}$/i.test(mac)) {
          setStatus("Введіть коректні IP та MAC-адресу.", true);
          return;
        }
        lines.push(leaseLine(ip, comment, mac, server));
        setStatus("Запис додано.");
      }

      renderOutput();
    }

    function resetFields() {
      importToken++;
      importedMacs = [];
      for (const id of ["ip", "comment", "mac", "server"]) {
        document.getElementById(id).value = "";
      }
      document.getElementById("mac").readOnly = false;
      document.getElementById("mac-file").value = "";
      document.getElementById("ip").placeholder = "192.168.10.22";
      document.querySelector(".add-btn").textContent = "+ Додати";
      renderMacList();
      updateIpPreview();
      setStatus("");
    }

    function removeLine(index) {
      lines.splice(index, 1);
      renderOutput();
    }

    function saveFile(extension) {
      const blob = new Blob([lines.join("\n")], { type: "text/plain" });
      const a = document.createElement("a");
      const url = URL.createObjectURL(blob);
      a.href = url;
      a.download = `dhcp_leases.${extension}`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // показати стартовий рядок
    renderOutput();
  </script>
</body>
</html>
